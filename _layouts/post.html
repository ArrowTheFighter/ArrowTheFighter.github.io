---
layout: default
---

<section>
  <div class="post-container">
    <h3 class="project-title">{{ page.title }}</h3>
    
     {% if page.developer %}
      <h4 p class="project-developer">Developer: {{ page.developer }}</h4>
    {% endif %}
    
    <div class="project-load">{{ content }}</div>
  </div>
  {% if site.data.settings.disqus.comments %}
    {% include disqus.html %}
  {% endif %}
</section>
